name: Windows installer

# Builds sea-mail-setup-<version>.exe: a per-user installer bundling Node.js, for people with no
# developer tools. Tags v* also attach it to the GitHub Release of that tag.
on:
  push:
    tags: ['v*']
    branches: ['claude/silly-snyder-987b6e'] # TEMPORARY: lets the workflow run before it is on main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create or update the release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build the app layout
        id: layout
        run: node scripts/package-windows.mjs

      - name: Unit-test sea-mail connect on Windows
        run: npx vitest run tests/unit/connect.test.ts

      - name: Smoke-test the layout
        run: npm run test:package
        env:
          SEA_MAIL_LAYOUT: ${{ steps.layout.outputs.layout }}

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.layout.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\sea-mail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, smoke-test the installed copy, uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.layout.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\sea-mail'
          $bin = Join-Path $app 'bin'
          $onUserPath = { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin }

          $log = Join-Path $PWD 'build\windows\install.log'
          $setup = Start-Process "build\windows\sea-mail-setup-$env:VERSION.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          if ($setup.ExitCode -ne 0) { Get-Content $log; throw "Setup exited with $($setup.ExitCode)" }
          if (-not (& $onUserPath)) { throw "$bin is not on the user PATH" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\sea-mail\Set up sea-mail.lnk")) {
            throw 'The Start menu shortcuts are missing'
          }

          & "$bin\sea-mail.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw "sea-mail.cmd --help exited with $LASTEXITCODE" }
          $env:SEA_MAIL_LAYOUT = $app
          npm run test:package
          if ($LASTEXITCODE -ne 0) { throw 'The smoke test of the installed copy failed' }

          # The uninstaller hands over to a copy of itself in %TEMP%, so wait for its effects instead.
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $uninstalled = { -not (Test-Path "$app\node\node.exe") -and -not (& $onUserPath) }
          $deadline = (Get-Date).AddMinutes(2)
          while (-not (& $uninstalled) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\node\node.exe") { throw 'The uninstaller left the app behind' }
          if (& $onUserPath) { throw "The uninstaller left $bin on the user PATH" }

      - uses: actions/upload-artifact@v7
        with:
          name: sea-mail-setup-${{ steps.layout.outputs.version }}
          path: build/windows/sea-mail-setup-${{ steps.layout.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: build/windows/sea-mail-setup-${{ steps.layout.outputs.version }}.exe
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" --title "sea-mail $GITHUB_REF_NAME" --generate-notes
          fi
